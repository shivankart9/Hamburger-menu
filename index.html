<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic" rel="stylesheet" />
    <title>Hamburger menu</title>
</head>
<link rel = "stylesheet" href = "style.css">
<body>
    <header>
        <div class = "header-content">
            <div class="logo">
            <img src="./pics/hamburber-logo.png" alt="logo">
        </div>
        <nav>
        <span class = "close-icon">&times;</span> <!-- &times for cross sign -->
        <a href = "#top-picks">Top picks</a>
        <a href = "#whopper">Whopper</a>
        <a href = "#stunner-menu">stunner Menu</a>
        <a href = "#new-collection">New Foodie Collection</a>
        <a href = "#deal-of-the-day">Deal of the Day</a>
    </nav>
        <div class="hamburger-menu">
            <span class = "hamburger-icon">&#9776;</span> <!--code for icon-->
        </div>
        </div>
    </header>

    <main>
        <section id = "first" class = "pic1">
            <div class = "first-pic">
                <img src="./pics/first-burger-pic.png" alt="first-burger">
            </div>
            <p>Well, You can’t resist anymore!</p>
        </section>
            
        <section id = "top-picks" class = "pic2">
            <p>Top Pics</p>
             <div class = "second-pic">
                <img src="./pics/top-picks.png" alt="top-picks">
             </div>
        </section>

        <section id = "whopper" class = "pic3">
            <p>Whopper</p>
            <div class = "third-pic">
                <img src="./pics/whopper.png" alt="Whopper">
            </div>
        </section>

        <section id = "stunner-menu" class = "pic4">
            <p>Stunner Menu</p>
            <div class = "fourth-pic">
                <img src="./pics/stunner-menu.png" alt="">
            </div>
        </section>

        <section id = "new-collection" class = "pic5">
            <p>New Foodie Collection</p>
            <div class = "fifth-pic">
                <img src="./pics/new-collection.png" alt="">
            </div>
            
        </section>

        <section id = "deal-of-the-day" class = "pic6">
            <p>Deal Of The Day</p>
            <div class = "sixth-pic">
                <img src="./pics/deal-of-the-day.png" alt="">
            </div>
        </section>
    </main>
    <footer>
        <h3 class = "go-to-top" ><a href = "#">Go to Top</a></h3>
        <p  >Made with ❤️ by shivankar</p>
    </footer>

</body>
<script src = "script.js"></script>
</html>
